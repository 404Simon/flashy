# Cargo audit configuration

[advisories]
# RSA timing sidechannel vulnerability in sqlx-mysql
# We only use SQLite and never MySQL, so this is not exploitable in our application
# Issue tracked: https://github.com/RustSec/advisory-db/issues/RUSTSEC-2023-0071
# We've set default-features = false on sqlx but the macro still pulls in mysql support
#
# paste crate - unmaintained but required by Leptos framework
# Monitoring for Leptos to migrate away from it
#
# rustls-webpki CRL matching logic vulnerability
# Blocked by AWS SDK dependency chain through llm crate (requires rustls 0.21.x)
# Limited impact: requires compromised CA to exploit
# Tracking upstream fix in aws-smithy-runtime
# RUSTSEC-2026-0104: Reachable panic in certificate revocation list parsing
# Same root cause as RUSTSEC-2026-0098 and RUSTSEC-2026-0099
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104"
]
